# Render Blueprint (https://render.com/docs/blueprint-spec).
# Deploying is a manual, user-initiated step — see docs/DEPLOYMENT.md.
databases:
  - name: apiforge-db
    plan: basic-256mb
    databaseName: apiforge
    user: apiforge

envVarGroups:
  - name: apiforge-shared
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false } # 32 random bytes, base64 — set in the dashboard
      - { key: ANTHROPIC_API_KEY, sync: false } # optional

services:
  - type: keyvalue
    name: apiforge-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: apiforge-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: apiforge-shared
      - { key: TRUST_PROXY, value: "1" }
      - { key: CORS_ORIGIN, sync: false } # e.g. https://apiforge-web.onrender.com
      - { key: DATABASE_URL, fromDatabase: { name: apiforge-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: apiforge-redis, property: connectionString } }

  - type: worker
    name: apiforge-worker
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: apiforge-shared
      - { key: DATABASE_URL, fromDatabase: { name: apiforge-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: apiforge-redis, property: connectionString } }

  - type: web
    name: apiforge-web
    runtime: static
    buildCommand: npm ci --workspace web --include-workspace-root=false && npm run build -w web
    staticPublishPath: web/dist
    routes:
      # Same-origin /api keeps the refresh cookie first-party. Replace with your API service URL.
      - { type: rewrite, source: /api/*, destination: https://apiforge-api.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
