# Render Blueprint (https://render.com/docs/blueprint-spec) — free-tier layout.
# Deploying is a manual, user-initiated step — see docs/DEPLOYMENT.md.
#
# Free-tier notes:
# - No Redis/worker: Render background workers are paid. Without REDIS_URL the API
#   runs suite jobs in-process, which is fully functional for a single instance.
# - Free web services sleep after ~15 min idle; the first request wakes them (~1 min).
# - Render's free Postgres expires after 30 days. For a long-lived demo, use a free
#   Neon/Supabase database instead: delete the `databases` block and set DATABASE_URL
#   on apiforge-api by hand.
databases:
  - name: apiforge-db
    plan: free
    databaseName: apiforge
    user: apiforge

services:
  - type: web
    name: apiforge-api
    plan: free
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false } # 32 random bytes, base64 — set in the dashboard
      - { key: CORS_ORIGIN, sync: false } # e.g. https://apiforge-web.onrender.com
      - { key: AI_PROVIDER, value: local } # free rule-based generator; no API key needed
      - { key: DATABASE_URL, fromDatabase: { name: apiforge-db, property: connectionString } }

  - type: web
    name: apiforge-web
    runtime: static
    buildCommand: npm ci --workspace web --include-workspace-root=false && npm run build -w web
    staticPublishPath: web/dist
    routes:
      # Same-origin /api keeps the refresh cookie first-party. Replace with your API service URL.
      - { type: rewrite, source: /api/*, destination: https://apiforge-api.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
